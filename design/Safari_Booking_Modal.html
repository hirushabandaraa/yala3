  <script>
    (function () {
      var form = document.getElementById('modal-booking-form');
      var pkgSelect = form ? form.elements['package'] : null;
      var totalEl = document.getElementById('modal-total');
      var confirmedEl = document.getElementById('booking-confirmed');

      if (pkgSelect && totalEl) {
        pkgSelect.addEventListener('change', function () {
          totalEl.textContent = '$' + pkgSelect.value;
        });
      }

      if (form && confirmedEl) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          confirmedEl.classList.remove('hidden');
        });
      }
    })();
  </script>
